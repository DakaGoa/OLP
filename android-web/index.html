<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12100e">
  <meta name="description" content="Old London Pub, Gavrila Principa 46, Belgrade — quiz nights, live music, comedy, DJs and everything else happening at your local.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Old London Pub — What's On</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>
  <div id="intro" class="intro" aria-label="Welcome to Old London Pub">
    <video id="intro-video" src="assets/video/intro.mp4" poster="assets/video/intro-poster.jpg" muted autoplay playsinline preload="auto"></video>
    <button id="intro-skip" class="intro-skip" type="button">Skip</button>
  </div>
  <script>
    (function () {
      var intro = document.getElementById('intro');
      var video = document.getElementById('intro-video');
      var done = false, seen = false;
      try { seen = sessionStorage.getItem('olp-intro-seen') === '1'; } catch (e) {}
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function remove() { if (intro && intro.parentNode) intro.parentNode.removeChild(intro); document.documentElement.classList.remove('intro-on'); }
      if (seen || reduce) { remove(); return; }
      document.documentElement.classList.add('intro-on');
      function dismiss() {
        if (done) return; done = true;
        try { sessionStorage.setItem('olp-intro-seen', '1'); } catch (e) {}
        intro.classList.add('intro-out');
        setTimeout(function () { try { video.pause(); } catch (e) {} remove(); }, 650);
      }
      video.addEventListener('ended', dismiss);
      video.addEventListener('error', dismiss);
      document.getElementById('intro-skip').addEventListener('click', dismiss);
      var cap = setTimeout(dismiss, 12000);
      video.addEventListener('loadedmetadata', function () {
        if (isFinite(video.duration) && video.duration > 0) { clearTimeout(cap); cap = setTimeout(dismiss, video.duration * 1000 + 1500); }
      });
      var p = video.play();
      if (p && p.catch) p.catch(dismiss);
    })();
  </script>
  <div id="app" aria-live="polite"></div>

  <div id="toast-host" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <button id="chat-fab" class="chat-fab" type="button" data-i18n-aria="nav.ask" aria-label="Ask OLP, the event assistant">
    <span class="chat-fab-icon"></span>
    <span class="chat-fab-label" data-i18n="nav.ask">Ask OLP</span>
    <span class="chat-fab-dot"></span>
  </button>

  <aside id="chat" class="chat" hidden aria-label="OLP assistant">
    <header class="chat-head">
      <div class="chat-avatar">OLP</div>
      <div class="chat-head-text">
        <strong data-i18n="chat.title">Ask OLP</strong>
        <span id="chat-subtitle">Your guide to what's on</span>
      </div>
      <button id="chat-close" class="icon-btn" type="button" data-i18n-aria="chat.close" aria-label="Close assistant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
    <div id="chat-chips" class="chat-chips"></div>
    <div id="chat-attach-preview" class="chat-attach-preview" hidden></div>
    <form id="chat-form" class="chat-composer" autocomplete="off">
      <label id="chat-attach" class="chat-attach" title="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
        <input id="chat-file" type="file" accept="image/*" data-i18n-aria="chat.attach" aria-label="Attach image">
      </label>
      <input id="chat-input" type="text" maxlength="400" data-i18n-placeholder="chat.placeholder" placeholder="What's on this Friday?" data-i18n-aria="chat.placeholder" aria-label="Message">
      <button id="chat-send" type="submit" data-i18n-aria="chat.send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-6z"/></svg>
      </button>
    </form>
    <div class="chat-foot"><span data-i18n="chat.foot">Ask about any date</span> · <span id="chat-mode" data-i18n="chat.mode">calendar assistant</span></div>
  </aside>

  <script>window.OLP_NATIVE = true;</script>
  <script src="js/seed.js"></script>
  <script src="js/core.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
